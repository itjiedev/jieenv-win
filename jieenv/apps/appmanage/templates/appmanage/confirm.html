{% extends "layout_main.html" %}

{% block page_title %}操作确认{% endblock %}
{% block page_content_title %}操作确认{% endblock %}

{% block page_content %}
<form method="post" data-ajax-submit
      data-url="{% url 'jiecore:api_app_action' app_name=app_name action=api_action %}"
      data-redirect="{{ redirect_url }}">{% csrf_token %}
    <div class="card">
        <div class="card-body p-0">
<div class="alert alert-danger alert-dismissible mb-0">
      <h5><i class="icon fas fa-exclamation-triangle mb-3"></i> 确认要 {{ confirm_action }}  吗？</h5>
    {{ confirm_message|safe }}
    </div>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-danger">确认提交</button>
            <a href="javascript:history.back();" class="btn btn-default float-right">取消</a>
        </div>
    </div>
</form>
{% endblock %}
