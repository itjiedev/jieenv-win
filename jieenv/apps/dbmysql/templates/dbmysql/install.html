{% extends "layout_main.html" %}

{% block page_content %}
<span style="display:none">{% csrf_token %}</span>
<div class="card-header p-0 mb-2 border-0">
    <div class="card-tools">
        <a href="javascript:;" id="btn-clear-downloads" class="btn btn-outline-danger btn-sm">
            <i class="fa fa-trash"></i> 清空已下载安装包</a>
        <a href="javascript:;" id="btn-fetch-versions" class="btn btn-outline-primary btn-sm">
            <i class="fa fa-refresh"></i> 重新抓取</a>
{#        <a href="{% url 'dbmysql:index' %}" class="btn btn-default btn-sm"><i class="fa fa-arrow-left"></i> 返回首页</a>#}
    </div>
    <div class="card-title p-2">
        <span class="text-muted"><i class="fa fa-info-circle"></i>
            选择版本后点"安装"进入安装选项页；也可直接下载 ZIP 压缩包 / Installer 安装包手动安装，装好后回首页"添加实例"登记</span>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title"><i class="fa fa-list"></i> 官网社区版版本列表</h3>
        <div class="card-tools"><span class="text-muted" id="version-source" style="font-size:12px"></span></div>
    </div>
    <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
            <thead>
                <tr><th>版本</th><th>通道</th><th>下载</th><th style="width:90px"></th></tr>
            </thead>
            <tbody id="version-tbody">
                <tr><td colspan="4" class="text-center text-muted py-4">正在加载版本列表...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block js_code %}
<script>
$(function () {
    function msg(text, ok) {
        layui.use('layer', function () {
            layui.layer.msg(text, {icon: ok ? 1 : 2, time: 3500});
        });
    }

    function fetchVersions(refresh) {
        var loadIdx = layui.layer.msg('正在加载版本列表...', {icon: 16, shade: [0.3, '#000'], time: 0});
        var $tbody = $('#version-tbody');
        $('#version-source').text('');
        $tbody.html('<tr><td colspan="4" class="text-center text-muted py-4">'
            + (refresh ? '正在从 MySQL 官网重新抓取版本列表...' : '正在加载版本列表...')
            + '</td></tr>');
        $.get('{% url 'dbmysql:api_versions' %}', refresh ? {refresh: 1} : {}).done(function (res) {
            layui.layer.close(loadIdx);
            if (!res || !res.success) {
                $tbody.html('<tr><td colspan="4" class="text-center text-danger py-4">获取版本列表失败</td></tr>');
                return;
            }
            if (res.source === 'cache') {
                $('#version-source').text('本地缓存 · 抓取于 ' + (res.fetched_at || '未知时间'));
            } else if (res.source === 'fallback') {
                $('#version-source').text('内置列表（官网不可达）');
                msg(res.message || '官网不可达，已使用内置版本列表', false);
            } else {
                $('#version-source').text('官网实时抓取 · ' + (res.fetched_at || ''));
                if (refresh) { msg('已从官网重新抓取版本列表', true); }
            }
            var html = '';
            $.each(res.versions, function (i, v) {
                var badge = v.channel === 'current' ? 'badge-primary'
                          : (v.is_lts ? 'badge-success' : 'badge-secondary');
                html += '<tr>'
                    + '<td><b>' + v.version + '</b></td>'
                    + '<td><span class="badge ' + badge + '">' + v.channel_display + '</span></td>'
                    + '<td>'
                    +   '<a href="' + v.url + '" target="_blank" title="' + v.url + '" class="btn btn-outline-info btn-sm">ZIP 压缩包</a>'
                    +   ' &nbsp;&nbsp; '
                    +   '<a href="' + v.installer_url + '" target="_blank" title="' + v.installer_url + '" class="btn btn-outline-info btn-sm">Installer 安装包</a>'
                    + '</td>'
                    + '<td><a href="{% url 'dbmysql:install_options' %}?version=' + encodeURIComponent(v.version)
                    +     '&channel=' + encodeURIComponent(v.channel)
                    +     '" class="btn btn-info btn-sm">安装</a></td>'
                    + '</tr>';
            });
            $tbody.html(html);
        }).fail(function () {
            $tbody.html('<tr><td colspan="4" class="text-center text-danger py-4">抓取请求失败，请检查网络后点击"重新抓取"</td></tr>');
        });
    }

    $('#btn-fetch-versions').on('click', function () { fetchVersions(true); });

    $('#btn-clear-downloads').on('click', function () {
        layui.use('layer', function () {
            var layer = layui.layer;
            layer.confirm('确定清空已下载的 MySQL 安装包吗？\n下次安装对应版本时会重新下载。',
                {icon: 3, title: '清空已下载安装包'}, function (index) {
                layer.close(index);
                var loadIdx = layer.msg('正在操作，请稍候...', {icon: 16, shade: [0.3, '#000'], time: 0});
                $.post('{% url "dbmysql:api_clear_downloads" %}').done(function (res) {
                    layer.close(loadIdx);
                    msg(res.message, res.success);
                }).fail(function () {
                    layer.close(loadIdx);
                    msg('请求失败', false);
                });
            });
        });
    });

    fetchVersions(false);
});
</script>
{% endblock %}
