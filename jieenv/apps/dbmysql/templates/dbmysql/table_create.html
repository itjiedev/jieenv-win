{% extends "layout_main.html" %}

{% block page_content %}
<span style="display:none">{% csrf_token %}</span>
<div class="card-header p-0 mb-2 border-0">
    <div class="card-title">
        <span class="badge badge-info py-2">
            <i class="fa fa-user"></i> {{ conn_info.user }}@{{ conn_info.host }}:{{ conn_info.port }}
        </span>
        <span class="badge badge-secondary py-2"><i class="fa fa-database"></i> {{ db }}</span>
    </div>
    <div class="card-tools">
{#        <a href="{% url 'dbmysql:tables' conn_id db %}" class="btn btn-default btn-sm"><i class="fa fa-arrow-left"></i> 表列表</a>#}
        <a href="javascript:;" id="btn-logout" class="btn btn-outline-danger btn-sm"><i class="fa fa-sign-out-alt"></i> 退出连接</a>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card card-success card-outline">
            <div class="card-header"><h3 class="card-title"><i class="fa fa-plus"></i> 新建数据表 - {{ db }}</h3></div>
            <div class="card-body">
                <div class="form-group">
                    <label>表名 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="table-name" placeholder="字母/数字/下划线/中文">
                </div>
                <div class="form-group">
                    <label>存储引擎</label>
                    <select class="form-control" id="table-engine">
                        <option value="InnoDB" selected>InnoDB</option>
                        <option value="MyISAM">MyISAM</option>
                        <option value="MEMORY">MEMORY</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>字符集</label>
                    <select class="form-control" id="table-charset"></select>
                </div>
                <div class="form-group">
                    <label>排序规则</label>
                    <select class="form-control" id="table-collation"></select>
                </div>
                <div class="form-group">
                    <label>表注释（可选）</label>
                    <input type="text" class="form-control" id="table-comment">
                </div>
                <button type="button" id="btn-table-create" class="btn btn-success"><i class="fa fa-save"></i> 创建</button>
                <a href="{% url 'dbmysql:tables' conn_id db %}" class="btn btn-default">返回</a>
                <small class="form-text text-muted">新表默认包含自增主键字段 id，创建后可到"字段管理"中添加其他字段</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js_code %}
<script>
$(function () {
    var BACK_URL = '{% url 'dbmysql:tables' conn_id db %}';
    var CHARSET_DATA = {{ charset_data_json|safe }};

    function msg(text, ok) {
        layui.use('layer', function () {
            layui.layer.msg(text, {icon: ok ? 1 : 2, time: 3000});
        });
    }

    // 根据字符集填充排序规则下拉
    function updateCollations(charset) {
        var $sel = $('#table-collation');
        $sel.empty();
        var info = CHARSET_DATA.charset_collations[charset];
        if (!info) return;
        $.each(info.collations, function (i, c) {
            $sel.append($('<option>').val(c).text(c + (c === info.default ? '（默认）' : '')));
        });
        if (info.default) $sel.val(info.default);
    }

    // 初始化字符集下拉
    (function () {
        var $sel = $('#table-charset');
        var defaultCharset = CHARSET_DATA.default_charset || 'utf8mb4';
        $.each(CHARSET_DATA.charsets, function (i, c) {
            $sel.append($('<option>').val(c).text(c + (c === defaultCharset ? '（默认）' : '')));
        });
        // 默认选中服务器默认字符集，若不存在则选 utf8mb4，再不存在选第一个
        $sel.val(defaultCharset);
        if (!$sel.val()) $sel.val('utf8mb4');
        if (!$sel.val() && CHARSET_DATA.charsets.length) {
            $sel.val(CHARSET_DATA.charsets[0]);
        }
        updateCollations($sel.val());
    })();

    // 字符集切换时更新排序规则
    $('#table-charset').on('change', function () {
        updateCollations($(this).val());
    });

    $('#btn-logout').on('click', function () {
        $.post('{% url 'dbmysql:api_logout' %}', {conn_id: '{{ conn_id }}'}).done(function (res) {
            window.location.href = res.redirect || '{% url 'dbmysql:index' %}';
        });
    });

    $('#btn-table-create').on('click', function () {
        var name = $('#table-name').val().trim();
        if (!name) { msg('请输入表名', false); return; }
        var loadIdx = layer.msg('正在操作，请稍候...', {icon: 16, shade: [0.3, '#000'], time: 0});
        $.post('{% url 'dbmysql:api_table' conn_id %}', {
            action: 'create', db: '{{ db }}', table: name,
            engine: $('#table-engine').val(),
            charset: $('#table-charset').val(),
            collation: $('#table-collation').val(),
            comment: $('#table-comment').val()
        }).done(function (res) {
            layer.close(loadIdx);
            msg(res.message, res.success);
            if (res.success) { setTimeout(function () { window.location.href = BACK_URL; }, 800); }
        });
    });
});
</script>
{% endblock %}
