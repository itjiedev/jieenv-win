{% extends 'layout_base.html' %}
{% load static %}

{% block logo %}
<a href="/" class="brand-link text-center">
  <img src="{% static 'mainapp/img/logo.png' %}" alt="Logo" class="brand-image img-circle">
  <span class="brand-text font-weight-light">{{ site_title }}</span>
</a>
{% endblock %}

{% block nav_top_right %}
  <li class="nav-item">
    <a class="nav-link btn-outline-success" href="javascript:;" id="btn-refresh-page" role="button" title="刷新">
      <i class="fas fa-refresh"></i> 刷新
    </a>
  </li>
<li class="nav-item">
  <a class="nav-link" href="{% url 'jiecore:platform_upgrade_page' %}" role="button" title="平台版本 v{{ platform_version }}，点击升级平台">
    <i class="fas fa-cloud"></i> v{{ platform_version }}
  </a>
</li>
<li class="nav-item">
  <a class="nav-link btn-outline-danger" href="javascript:;" id="btn-restart-server" role="button" title="重启服务">
    <i class="fas fa-redo-alt"></i> 重启服务
  </a>
</li>
{% endblock %}
